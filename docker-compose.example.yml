services:
  arcane-pangolin-sync:
    image: ghcr.io/gitlogos/arcane-pangolin-sync:latest
    restart: unless-stopped
    environment:
      ARCANE_URL: http://arcane:3552
      ARCANE_API_KEY: ${ARCANE_API_KEY}

      # Pangolin integration API URL. Self-hosted default is usually http://pangolin:3003, with or without /v1.
      PANGOLIN_URL: http://pangolin:3003
      PANGOLIN_API_KEY: ${PANGOLIN_API_KEY}
      PANGOLIN_ORG_ID: ${PANGOLIN_ORG_ID}
      PANGOLIN_DOMAIN_ID: ${PANGOLIN_DOMAIN_ID}

      # Recommended: use an existing Pangolin site/local site that can reach your Docker nodes.
      PANGOLIN_SITE_ID: ${PANGOLIN_SITE_ID}
      # Alternative: create/delete one site per Arcane stack. Keep false when using Pangolin local resources.
      PANGOLIN_CREATE_SITES: "false"

      # Applies this shared policy to every existing and newly managed public resource.
      PANGOLIN_RESOURCE_POLICY_ID: ${PANGOLIN_RESOURCE_POLICY_ID}

      # Adopt a pre-existing Pangolin public resource when its enabled targets exactly match the desired ip:port set.
      ADOPT_EXISTING: "true"

      # Optional explicit target IPs for Docker published ports bound to 0.0.0.0 and for host-network ports.
      # If unset, the syncer tries to use the IP host from Arcane's configured environment API URL.
      # DEFAULT_TARGET_IP: 192.168.1.10
      # ARCANE_ENV_TARGET_IPS: "0=192.168.1.10,remote-env-id=192.168.1.11,*=192.168.1.10"

      DRY_RUN: "true"
      STATE_FILE: /data/state.json
    volumes:
      - arcane-pangolin-sync-data:/data

volumes:
  arcane-pangolin-sync-data:
